name: plantcare

services:
  database:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Express
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD:?Set SQL_PASSWORD in .env}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - /opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" -C -Q "SELECT 1" -b -o /dev/null
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  api:
    build:
      context: .
      target: api
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__PlantCareDatabase: Server=database,1433;Database=PlantCare;User Id=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Database__ApplyMigrationsOnStartup: "true"
      ReverseProxy__TrustForwardedHeaders: "true"
      DataProtection__KeysPath: /var/lib/plantcare/keys
      GoogleCalendar__Enabled: ${GOOGLE_CALENDAR_ENABLED:-false}
      GoogleCalendar__ClientId: ${GOOGLE_CALENDAR_CLIENT_ID:-}
      GoogleCalendar__ClientSecret: ${GOOGLE_CALENDAR_CLIENT_SECRET:-}
      GoogleCalendar__CallbackUrl: https://${PLANTCARE_DOMAIN}/api/calendar/integrations/google/callback
      Email__Host: ${SMTP_HOST:?Set SMTP_HOST in .env}
      Email__Port: ${SMTP_PORT:-587}
      Email__UseSsl: ${SMTP_USE_SSL:-true}
      Email__Username: ${SMTP_USERNAME}
      Email__Password: ${SMTP_PASSWORD}
      Email__FromAddress: ${SMTP_FROM_ADDRESS:?Set SMTP_FROM_ADDRESS in .env}
      Email__FromName: ${SMTP_FROM_NAME:-PlantCare}
      Email__ClientBaseUrl: https://${PLANTCARE_DOMAIN:?Set PLANTCARE_DOMAIN in .env}
      WebPush__Subject: ${WEB_PUSH_SUBJECT}
      WebPush__PublicKey: ${WEB_PUSH_PUBLIC_KEY}
      WebPush__PrivateKey: ${WEB_PUSH_PRIVATE_KEY}
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - data-protection-keys:/var/lib/plantcare/keys
    healthcheck:
      test: [CMD, curl, --fail, --silent, http://localhost:8080/health/ready]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  worker:
    build:
      context: .
      target: worker
    environment:
      DOTNET_ENVIRONMENT: Production
      ConnectionStrings__PlantCareDatabase: Server=database,1433;Database=PlantCare;User Id=sa;Password=${SQL_PASSWORD};Encrypt=True;TrustServerCertificate=True
      Notifications__PollIntervalSeconds: ${NOTIFICATION_POLL_SECONDS:-60}
      Notifications__BatchSize: ${NOTIFICATION_BATCH_SIZE:-100}
      WebPush__Subject: ${WEB_PUSH_SUBJECT}
      WebPush__PublicKey: ${WEB_PUSH_PUBLIC_KEY}
      WebPush__PrivateKey: ${WEB_PUSH_PRIVATE_KEY}
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  proxy:
    image: caddy:2-alpine
    environment:
      PLANTCARE_DOMAIN: ${PLANTCARE_DOMAIN:?Set PLANTCARE_DOMAIN in .env}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

volumes:
  sql-data:
  caddy-data:
  caddy-config:
  data-protection-keys:
