name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      full_system:
        description: Run full system validation
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select and test validation scope
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.sha }}
          FORCE_FULL: ${{ github.event_name == 'workflow_dispatch' && inputs.full_system }}
        run: |
          python3 -m unittest discover -s tests -p test_ci_test_scope.py
          python3 scripts/ci_test_scope.py

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore PlantCare.slnx

      - name: Build
        run: dotnet build PlantCare.slnx --configuration Release --no-restore

      - name: Test
        shell: bash
        run: |
          if [ '${{ steps.scope.outputs.scope }}' = catalog ]; then
            dotnet test PlantCare.slnx --configuration Release --no-build --filter 'FullyQualifiedName~PlantCatalogProfileTests|FullyQualifiedName~BootstrapCommandTests'
          else
            dotnet test PlantCare.slnx --configuration Release --no-build
          fi

      - name: Test backup retention safety
        if: steps.scope.outputs.scope != 'catalog'
        shell: pwsh
        run: ./scripts/Test-BackupRetention.ps1

      - name: Check catalog image attribution and integrity
        shell: pwsh
        run: ./scripts/Test-CatalogAssets.ps1

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    needs: backend

    defaults:
      run:
        working-directory: plant-care-web

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
          run_install: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: plant-care-web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Test
        shell: bash
        run: |
          if [ '${{ needs.backend.outputs.scope }}' = catalog ]; then
            pnpm exec ng test --watch=false --include '**/garden-page.spec.ts' --include '**/plant-catalog-page.spec.ts' --include '**/plant-growing-guide.spec.ts' --include '**/my-plant-detail-page.spec.ts' --include '**/plant-comparison-page.spec.ts' --include '**/plant-photo.spec.ts'
          else
            pnpm test:ci
          fi

      - name: Build
        run: pnpm build

  container:
    name: Production container
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs:
      - backend
      - frontend

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET for SQL Server push checks
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Build production image
        run: docker build --target api --tag plantcare:ci .

      - name: Check packaged frontend attribution
        run: docker run --rm --entrypoint sh plantcare:ci -c 'test -s /app/wwwroot/3rdpartylicenses.txt && grep -q "Copyright" /app/wwwroot/3rdpartylicenses.txt && grep -q "Permission is hereby granted" /app/wwwroot/3rdpartylicenses.txt'

      - name: Build and check worker runtime
        run: |
          docker build --target worker --tag plantcare-worker:ci .
          docker run --rm --entrypoint dotnet plantcare-worker:ci --list-runtimes | grep -q '^Microsoft.AspNetCore.App '

      - name: Start SQL Server stack and check runtime grants
        shell: pwsh
        run: |
          docker tag plantcare:ci plantcare-local-api
          if ($LASTEXITCODE -ne 0) { throw 'API image tagging failed.' }
          docker tag plantcare-worker:ci plantcare-local-worker
          if ($LASTEXITCODE -ne 0) { throw 'Worker image tagging failed.' }
          ./scripts/Start-LocalDeployment.ps1 -SkipBuild
          ./scripts/Test-LocalDatabaseAccess.ps1

      - name: Test real-cookie account isolation on SQL Server
        if: needs.backend.outputs.scope != 'catalog'
        shell: pwsh
        run: |
          ./scripts/Test-LocalAccountIsolation.ps1

      - name: Test password resets and session security on SQL Server
        if: needs.backend.outputs.scope != 'catalog'
        shell: pwsh
        run: ./scripts/Test-LocalAuthenticationSecurity.ps1

      - name: Test push failures and retries on SQL Server
        if: needs.backend.outputs.scope != 'catalog'
        shell: pwsh
        run: ./scripts/Test-LocalPushDelivery.ps1

      - name: Test browser journeys, accessibility and PWA updates
        shell: pwsh
        env:
          TEST_SCOPE: ${{ needs.backend.outputs.scope }}
        run: |
          if ($env:TEST_SCOPE -eq 'catalog') { ./scripts/Test-LocalBrowserJourney.ps1 -CatalogOnly }
          else { ./scripts/Test-LocalBrowserJourney.ps1 }

      - name: Remove isolated CI database and containers
        if: always()
        run: |
          if [ -f .env.local ]; then
            docker compose --env-file .env.local -f compose.yaml -f compose.local.yaml --project-name plantcare-local down --volumes
          fi
