<main class="auth-page">
  <section class="auth-card">
    <p class="eyebrow">PlantCare</p>
    <h1>Choose a new password</h1>

    @if (!hasValidLink) {
    <p class="form-error">
      This reset link is incomplete. Request a new password-reset email.
    </p>
    <p class="auth-alternative">
      <a routerLink="/forgot-password">Request a new link</a>
    </p>
    } @else {
    <form [formGroup]="form" (ngSubmit)="submit()">
      <label for="password">New password</label>
      <input id="password"
             type="password"
             autocomplete="new-password"
             formControlName="password">
      <p class="field-hint">
        Use at least 10 characters, including an uppercase letter,
        lowercase letter, and number.
      </p>

      <label for="confirmPassword">Confirm new password</label>
      <input id="confirmPassword"
             type="password"
             autocomplete="new-password"
             formControlName="confirmPassword">

      @if (errorMessage()) {
      <p class="form-error">{{ errorMessage() }}</p>
      }

      <button type="submit" [disabled]="isSubmitting()">
        {{ isSubmitting() ? 'Resetting...' : 'Reset password' }}
      </button>
    </form>
    }
  </section>
</main>
